{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-5 fw-bold">Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" class="ps-4">Name</th>
                    <th scope="col" class="text-center">Update</th>
                    <th scope="col" class="text-center pe-4">Delete</th>
                </tr>
            </thead>
            <tbody>
                {% for tag in tag_list %}
                <tr>
                    <td class="align-middle ps-4">
                        <span class="fw-bold">{{ tag.name }}</span>
                    </td>
                    <td class="text-center align-middle">
                        <a href="{% url 'todo:tag-update' tag.id %}" class="btn btn-secondary btn-sm px-3">
                            Update
                        </a>
                    </td>
                    <td class="text-center align-middle pe-4">
                        <a href="{% url 'todo:tag-delete' tag.id %}" class="btn btn-dark btn-sm px-3">
                            Delete
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center py-4 text-muted">
                        No tags found. Create one to get started!
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
